name: Java CI with Gradle & SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # macOS runners support hardware acceleration, making the emulator much faster
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # CRITICAL: SonarCloud requires the full git history to analyze PRs and blame properly
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add Maps API Key to local.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Run Tests and Generate Combined JaCoCo Report
        uses: reactivecircus/android-emulator-runner@v2
        with:
            api-level: 29
            target: google_apis # Changed to support ARM
            arch: arm64-v8a     # Changed to match Apple Silicon (M1/M2) host
            profile: Nexus 6
            script: ./gradlew clean testDebugUnitTest connectedDebugAndroidTest jacocoCombinedTestReport

      - name: Run SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # This overrides the localhost URL in your build.gradle and passes the merged 74% report
        run: ./gradlew sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoCombinedTestReport/jacocoCombinedTestReport.xml

      - name: Upload JaCoCo HTML Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoCombinedTestReport/html/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Explicitly pointing Codecov to the combined file just to be safe
          files: app/build/reports/jacoco/jacocoCombinedTestReport/jacocoCombinedTestReport.xml